name: fitness_day
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  easy_localization: ^3.0.8
  dio: ^5.9.0
  # Direct dependency because chat uploads set MultipartFile.contentType by
  # hand — without an explicit MIME the server's upload filter rejects PDFs.
  http_parser: ^4.1.2
  pretty_dio_logger: ^1.4.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.0.0-beta.4
  go_router: ^16.2.4
  modal_progress_hud_nsn: ^0.5.1
  omni_image: ^0.0.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_time_picker_spinner: ^2.0.0
  fl_chart: ^1.1.1
  pinput: ^5.0.1
  percent_indicator: ^4.2.5
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  lottie: ^3.3.1

  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.3
  # SHA-256 hashing of the Sign in with Apple nonce.
  crypto: ^3.0.6

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.5.0

  camera: ^0.11.2+1

  google_generative_ai: ^0.4.7

  http: ^1.5.0
  flutter_image_compress: ^2.4.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.3
  
  # Map dependencies
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  share_plus: ^12.0.1
  uuid: ^4.5.1
  flutter_dotenv: ^5.1.0

  # Health & Activity tracking
  health: ^12.2.0
  pedometer: ^4.0.1
  # The OS's own STILL / WALKING classifier. The step sensor is a vibration
  # counter and cannot tell walking from a shaken phone; this can, and it works
  # indoors where GPS gives nothing.
  flutter_activity_recognition: ^3.0.0

  # Connectivity / network status
  connectivity_plus: ^6.1.0
  socket_io_client: ^2.0.3+1
  file_picker: ^11.0.2
  record: ^6.2.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/translations/
    - assets/audio/
    - assets/video/
    # Bundled so the app can read secrets at runtime on any machine that has
    # the file — no --dart-define needed. .env is gitignored, so each dev
    # supplies their own. NOTE: bundling embeds the key in the build; keep this
    # for dev only and move secrets behind a backend before a real release.
    - .env

  fonts:
    - family: Bukra
      fonts:
        - asset: assets/fonts/29ltbukralight.otf
          weight: 300
        - asset: assets/fonts/29ltbukraregular.otf
          weight: 400
        - asset: assets/fonts/29lt-bukra-medium.otf
          weight: 500
        - asset: assets/fonts/29ltbukrabold.otf
          weight: 700