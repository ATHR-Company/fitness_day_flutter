name: fitness_day
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  easy_localization: ^3.0.8
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.0.0-beta.4
  go_router: ^16.2.4
  modal_progress_hud_nsn: ^0.5.1
  omni_image: ^0.0.5
  table_calendar: ^3.2.0
  intl: ^0.20.2
  flutter_time_picker_spinner: ^2.0.0
  fl_chart: ^1.1.1
  pinput: ^5.0.1
  percent_indicator: ^4.2.5
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  lottie: ^3.3.1

  google_sign_in: ^6.3.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.5.0

  camera: ^0.11.2+1

  google_generative_ai: ^0.4.7

  http: ^1.5.0
  flutter_image_compress: ^2.4.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.3
  
  # Map dependencies
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5

  # Health & Activity tracking
  health: ^12.2.0
  pedometer: ^4.0.1

  # Connectivity / network status
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/translations/
    - assets/audio/
    - assets/video/

  fonts:
    - family: Bukra
      fonts:
        - asset: assets/fonts/29ltbukralight.otf
          weight: 300
        - asset: assets/fonts/29ltbukraregular.otf
          weight: 400
        - asset: assets/fonts/29lt-bukra-medium.otf
          weight: 500
        - asset: assets/fonts/29ltbukrabold.otf
          weight: 700